server:
  port: 8081

spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/GESTION_LIVRAISON
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/admin.fleetlog

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  main:
    lazy-initialization: true

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
      springframework:
        web: INFO